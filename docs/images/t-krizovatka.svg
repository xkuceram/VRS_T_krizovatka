<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
  <title id="title">Pruhy a semafory na modeli T-križovatky</title>
  <desc id="description">Pohľad zhora s vjazdom A zľava, dvoma príjazdovými pruhmi B_R a B_D sprava a vjazdom C zdola. Doplnková šípka A_S povoľuje odbočenie dole, C_S odbočenie doprava. Priechod P vedie cez dolnú vetvu. Infračervený lúč snímača C vedie cez príjazdový pruh pred stopčiarou.</desc>
  <defs>
    <marker id="lane-arrow" markerWidth="7" markerHeight="7" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#f8fafc"/>
    </marker>
    <g id="three-lights">
      <circle cx="0" cy="0" r="5" fill="#d7474b"/>
      <circle cx="14" cy="0" r="5" fill="#dd9d20"/>
      <circle cx="28" cy="0" r="5" fill="#26835c"/>
    </g>
    <g id="arrow-light">
      <rect x="-5" y="-10" width="39" height="20" rx="6" fill="#e4f3e9"/>
      <path d="M3 0h20m-7-6 7 6-7 6" fill="none" stroke="#21724d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1000" height="620" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, sans-serif">
