      <path d="M404 420h14v29h-14zM429 420h14v29h-14zM454 420h14v29h-14zM479 420h14v29h-14zM504 420h14v29h-14zM529 420h14v29h-14zM554 420h14v29h-14zM579 420h14v29h-14z"/>
