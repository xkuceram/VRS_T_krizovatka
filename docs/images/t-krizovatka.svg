      <text x="151" y="476">Dole pri červenej A</text>
      <text x="771" y="82">Rovno doľava</text>
      <text x="771" y="113">Odbočenie dole</text>
      <text x="771" y="517">Doľava alebo doprava</text>
      <text x="771" y="549">Doprava pri červenej C</text>
