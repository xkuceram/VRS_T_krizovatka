<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="670" viewBox="0 0 1060 670" role="img" aria-labelledby="title description">
  <title id="title">Prepojenie NUCLEO a dvoch registrov 74HC595</title>
  <desc id="description">A0 vedie do SER prvého registra. QH prime prvého registra vedie do SER druhého registra. A1, A2 a A3 sú spoločné riadiace signály. Výstupy registrov napájajú 16 LED cez samostatné rezistory.</desc>
  <defs>
    <marker id="wire-arrow" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#3b6996"/>
    </marker>
  </defs>
  <rect width="1060" height="670" fill="#f8fafc"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#25384a">
    <text x="38" y="59" font-size="29" font-weight="700">Zapojenie 16 LED</text>
    <g fill="#fff" stroke="#d9e2ea" stroke-width="1.5">
      <rect x="36" y="100" width="265" height="153" rx="12"/>
      <rect x="381" y="100" width="298" height="153" rx="12"/>
      <rect x="759" y="100" width="265" height="153" rx="12"/>
      <rect x="36" y="283" width="988" height="170" rx="12"/>
      <rect x="36" y="478" width="472" height="151" rx="12"/>
      <rect x="530" y="478" width="494" height="151" rx="12"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="54" y="136">NUCLEO-F303K8</text>
      <text x="400" y="136">U1 · 74HC595</text>
      <text x="778" y="136">U2 · 74HC595</text>
      <text x="55" y="318">Spoločné signály pre U1 aj U2</text>
      <text x="55" y="514">Napájanie oboch registrov</text>
      <text x="549" y="514">Jedna vetva LED</text>
    </g>
    <g font-size="15" fill="#425b72">
      <text x="210" y="191">A0 (PA0)</text>
      <text x="400" y="191">SER (14)</text>
      <text x="592" y="191">QH′ (9)</text>
      <text x="778" y="191">SER (14)</text>
      <text x="400" y="226">QA až QH · 8 LED pre A a C</text>
      <text x="778" y="226">QA až QH · 8 LED pre B a P</text>
      <text x="56" y="352">A1 (PA1)</text>
      <text x="56" y="387">A2 (PA3)</text>
      <text x="56" y="422">A3 (PA4)</text>
      <text x="310" y="352">SRCLK (11)</text>
      <text x="310" y="387">RCLK (12)</text>
      <text x="310" y="422">/OE (13)</text>
      <text x="569" y="352">Hodinový signál na posun bitov</text>
      <text x="569" y="387">Zápis nového stavu na výstupy</text>
      <text x="569" y="422">Spoločný pull-up 10 kΩ na +3V3</text>
      <text x="55" y="549">VCC (16) a /SRCLR (10) → +3V3</text>
      <text x="55" y="576">GND (8) → spoločná zem</text>
      <text x="55" y="603">100 nF medzi VCC a GND pri každom registri</text>
    </g>
    <g fill="none" stroke="#3b6996" stroke-width="2.4" marker-end="url(#wire-arrow)">
      <path d="M301 185H377"/>
      <path d="M679 185H755"/>
      <path d="M170 346H289"/>
      <path d="M170 381H289"/>
      <path d="M170 416H289"/>
    </g>
    <g fill="none" stroke="#344e64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M559 566H631M713 566H765M806 566H933"/>
      <rect x="631" y="557" width="82" height="18"/>
      <path d="M765 552v28l41-14zM806 552v28"/>
      <path d="M933 566v14m-12 0h24m-19 6h14m-10 6h6"/>
      <path d="M777 547l9-10m-7 1 7-1-1 7m5 3 9-10m-7 1 7-1-1 7" stroke="#26835c" stroke-width="1.7"/>
    </g>
    <g font-size="14" fill="#425b72">
      <text x="548" y="550">Qx</text>
      <text x="648" y="548">680 Ω</text>
      <text x="768" y="607">LED</text>
      <text x="913" y="610">GND</text>
    </g>
  </g>
</svg>
